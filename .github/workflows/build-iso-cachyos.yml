name: Build ISO (CachyOS)

# cachyos variant: the full CachyOS layer (linux-cachyos kernel, cachyos-settings,
# schedulers, proton) baked into the offline closure. fires on a cachyos-v*
# release tag or a manual dispatch, and calls the reusable builder with
# variant=cachyos. a maintainer can dispatch from unstable-dev with
# `-f publish=false -f repo_url=https://repo.ryoku.dev/stable/channels/testing/x86_64`
# to get a testing ISO as the `ryoku-iso` artifact. a separate workflow means its
# own run counter, so the cachyos tracking id is independent of the plain one
# ("R1" on the first build). it publishes latest-cachyos.json/latest-cachyos.js
# to the same R2 bucket, which the website reads alongside the plain latest.json.
on:
  workflow_dispatch:
    inputs:
      release_stage:
        description: 'Public release stage'
        required: true
        default: 'beta'
        type: choice
        options:
          - alpha
          - beta
          - stable
      repo_url:
        description: '[ryoku] repo to bake from (a releases/<tag>/x86_64 URL); empty = stable pointer'
        required: false
        default: ''
        type: string
      publish:
        description: 'Upload the ISO and move the latest pointer; false keeps it as a workflow artifact only'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'cachyos-v*'

permissions:
  contents: read
  # the reusable builder's Trivy step uploads the ISO scan as SARIF.
  security-events: write

jobs:
  build:
    uses: ./.github/workflows/build-iso-reusable.yml
    with:
      variant: cachyos
      release_stage: ${{ github.event.inputs.release_stage || 'beta' }}
      repo_url: ${{ github.event.inputs.repo_url || '' }}
      publish: ${{ github.event.inputs.publish != 'false' }}
    secrets: inherit
