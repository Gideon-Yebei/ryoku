name: Stash probe

on:
  pull_request:
    paths:
      - 'ryoku/shell/scripts/stash-cobalt.sh'
      - 'tests/stash-probe.sh'
      - '.github/workflows/stash-probe.yml'
  push:
    branches:
      - main
    paths:
      - 'ryoku/shell/scripts/stash-cobalt.sh'
      - 'tests/stash-probe.sh'
      - '.github/workflows/stash-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stash-probe:
    name: Stash quality probe and download selectors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe tiers and download arguments
        shell: bash
        run: bash tests/stash-probe.sh
