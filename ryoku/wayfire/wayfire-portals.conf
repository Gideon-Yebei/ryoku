# Wayfire exposes wlroots screencopy and does not implement Mutter's
# org.gnome.Mutter.ScreenCast service, so the GNOME backend cannot capture this
# session. xdg-desktop-portal-wlr speaks Wayfire's native protocol and implements
# the two capture interfaces; GTK handles every other portal, including file
# pickers.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
